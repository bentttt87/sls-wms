name: Apply Material Picker UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-material-picker.yml'
      - '.github/patch_material_picker.py'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply searchable material picker
        shell: bash
        run: python .github/patch_material_picker.py
      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'WMS SLS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve material classification picker [skip ci]'
          git push
