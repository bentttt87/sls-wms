name: Fix Mobile ROMAN Script Placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-roman-wire.yml'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move mobile brand script to real document body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="mobile-roman.js?v=20260908"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html: final </body> not found')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('mobile script wired before final body close')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'WMS SLS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix ROMAN mobile script placement [skip ci]'
          git push
