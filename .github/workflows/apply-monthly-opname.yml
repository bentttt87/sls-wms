name: Apply Monthly Full Stock Opname

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-monthly-opname.yml'
      - '.github/patch_monthly_opname.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WMS stock opname UI
        run: python .github/patch_monthly_opname.py
      - name: Commit WMS update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "WMS SLS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add monthly full stock opname mode [skip ci]"
          git push
