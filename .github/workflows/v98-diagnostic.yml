name: WMS v98 diagnostic
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile loader
        run: node --check mobile-roman.js
      - name: Check physical-capacity patch
        run: node --check wms_remove_quota_v88.js
      - name: Check cleanup patch
        run: node --check wms_quota_cleanup_v90.js
      - name: Check receiving patch source
        run: node --check wms_receiving_autodoc_v83.js
      - name: Check index inline scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          for i,m in enumerate(re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',s,re.I|re.S),1):
              if 'src=' in (m.group('attrs') or '').lower(): continue
              body=m.group('body') or ''
              if not body.strip(): continue
              p=Path('/tmp')/f'inline_{i}.js';p.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
