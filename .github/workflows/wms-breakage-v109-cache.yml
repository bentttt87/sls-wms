name: WMS breakage v109 cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'mobile-roman\.js\?v=[^"\']+','mobile-roman.js?v=20260923a',s)
          if n<1: raise SystemExit('mobile-roman loader not found')
          p.write_text(s,encoding='utf-8')
          print('cache refs patched',n)
          PY
      - name: Static JavaScript smoke
        run: |
          node --check mobile-roman.js
          node --check wms_breakage_bridge_v109.js
          grep -q "wms_breakage_bridge_v109.js?v=20260923a" mobile-roman.js
          grep -q "mobile-roman.js?v=20260923a" index.html
      - name: Commit cache update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reload WMS breakage bridge v109"
          git push
