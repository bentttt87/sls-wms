name: Apply Mobile ROMAN Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-roman.yml'
      - 'mobile-roman.css'
      - 'mobile-roman.js'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire responsive mobile theme into WMS index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          css='<link rel="stylesheet" href="mobile-roman.css?v=20260908">'
          js='<script src="mobile-roman.js?v=20260908"></script>'
          if css not in s:
              if '</head>' not in s:
                  raise SystemExit('index.html: </head> not found')
              s=s.replace('</head>',css+'\n</head>',1)
              changed=True
          if js not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html: </body> not found')
              s=s.replace('</body>',js+'\n</body>',1)
              changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
              print('index.html patched')
          else:
              print('index.html already wired')
          PY
      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'WMS SLS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply ROMAN responsive mobile view to WMS [skip ci]'
          git push
