name: WMS PGI v99 cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache bust v99
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'mobile-roman\.js\?v=[^"\']+','mobile-roman.js?v=20260915a',s)
          if n<1: raise SystemExit('mobile loader not found')
          p.write_text(s,encoding='utf-8')
          print('replaced',n)
          PY
      - name: Static JavaScript smoke
        run: |
          node --check mobile-roman.js
          node --check wms_pgi_v99.js
          node --check wms_roles_v92.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          idx=Path('index.html').read_text(encoding='utf-8')
          assert 'mobile-roman.js?v=20260915a' in idx
          mob=Path('mobile-roman.js').read_text(encoding='utf-8')
          assert 'wms_pgi_v99.js?v=20260915a' in mob
          blocks=[]
          for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',idx,re.I|re.S):
            if 'src=' in (m.group('attrs') or '').lower(): continue
            body=m.group('body') or ''
            if body.strip(): blocks.append(body)
          for i,body in enumerate(blocks,1):
            p=Path('/tmp')/f'wms_inline_pgi_{i}.js';p.write_text(body,encoding='utf-8')
            subprocess.run(['node','--check',str(p)],check=True)
          print('inline blocks',len(blocks))
          PY
      - name: Commit index cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load WMS PGI v99 frontend"
          git push
