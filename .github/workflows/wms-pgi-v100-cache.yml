name: WMS PGI v100 cache
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache bust index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'mobile-roman\.js\?v=[^"\']+','mobile-roman.js?v=20260915-pgi100',s)
          if n<1: raise SystemExit('mobile-roman loader not found')
          p.write_text(s,encoding='utf-8')
          print('updated',n,'mobile loader(s)')
          PY
      - name: Static smoke
        run: |
          node --check mobile-roman.js
          node --check wms_pgi_v100.js
          grep -q "wms_pgi_v100.js?v=20260915b" mobile-roman.js
          grep -q "mobile-roman.js?v=20260915-pgi100" index.html
      - name: Commit index cache key
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cache bust WMS PGI v100"
          git push
