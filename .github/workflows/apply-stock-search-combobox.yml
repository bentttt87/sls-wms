name: Apply Stock Search Combobox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stock-search-combobox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply searchable dropdowns to Stock On Hand
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          repls = {
            '<div><label>Motif / Kode</label><input id="fMotif" placeholder="mis. Ginza"></div>': '<div><label>Material / Motif</label><input id="fMotif" list="dlMaterial" autocomplete="off" placeholder="Ketik atau pilih material"></div>',
            '<div style="max-width:120px"><label>Seri</label><input id="fSeri" placeholder="S12S"></div>': '<div style="max-width:180px"><label>Seri</label><input id="fSeri" list="dlSeri" autocomplete="off" placeholder="Semua seri"></div>',
            '<div><label>Gudang</label><input id="fGudang" placeholder="B"></div>': '<div><label>Gudang</label><input id="fGudang" list="dlGudang" autocomplete="off" placeholder="Semua gudang"></div>',
            '<div><label>Block</label><input id="fBlock" placeholder="A"></div>': '<div><label>Block</label><input id="fBlock" list="dlBlock" autocomplete="off" placeholder="Semua block"></div>',
            '<div><label>Kavling</label><input id="fKav" placeholder="15"></div>': '<div><label>Kavling</label><input id="fKav" list="dlKavling" autocomplete="off" placeholder="Semua kavling"></div>',
          }
          for old,new in repls.items():
            if old not in s:
              raise SystemExit('Expected Stock filter HTML not found: '+old)
            s=s.replace(old,new,1)

          marker='''  <div class="row" style="margin-bottom:10px">\n    <div><label>Status</label><select id="fStatus">'''
          add='''  <datalist id="dlMaterial"></datalist>\n  <datalist id="dlSeri"></datalist>\n  <datalist id="dlGudang"></datalist>\n  <datalist id="dlBlock"></datalist>\n  <datalist id="dlKavling"></datalist>\n  <div class="hint" id="stFilterHelp" style="margin-bottom:8px">Klik field untuk memilih dari data aktual RDC, atau ketik untuk mencari. Gudang → Block → Kavling saling mengikuti.</div>\n  <div class="row" style="margin-bottom:10px">\n    <div><label>Status</label><select id="fStatus">'''
          if marker not in s:
            raise SystemExit('Status row marker not found')
          s=s.replace(marker,add,1)

          js_marker='let ST_PAGE=0, ST_LIMIT=100, ST_TOTAL=0, ST_ROWS=[];'
          helper=r'''// ===== STOCK ON HAND SEARCHABLE DROPDOWN / CASCADING FILTER =====
let ST_FILTER_TIMER=null;
let ST_FILTER_LOADING=false;
function fillDatalist(id,items,mapper){
  const dl=document.getElementById(id); if(!dl)return;
  dl.innerHTML=(items||[]).map(v=>{
    const x=mapper?mapper(v):{value:v,label:''};
    return `<option value="${esc(x.value??'')}"${x.label?` label="${esc(x.label)}"`:''}></option>`;
  }).join('');
}
async function loadStockFilterOptions(){
  if(ST_FILTER_LOADING)return;
  ST_FILTER_LOADING=true;
  try{
    const motif=(document.getElementById('fMotif')?.value||'').trim();
    const gudang=(document.getElementById('fGudang')?.value||'').trim();
    const block=(document.getElementById('fBlock')?.value||'').trim();
    const d=await rpc('wms_stock_filter_options',{p_rdc:RDC,p_motif:motif,p_gudang:gudang,p_block:block});
    fillDatalist('dlMaterial',d.materials||[],v=>({value:v.material_code,label:v.description||''}));
    fillDatalist('dlSeri',d.series||[]);
    fillDatalist('dlGudang',d.warehouses||[]);
    fillDatalist('dlBlock',d.blocks||[]);
    fillDatalist('dlKavling',d.kavlings||[],v=>({value:v.code,label:v.location_code||v.code}));
    const seri=document.getElementById('fSeri');
    if(seri && seri.value && (d.series||[]).length && !(d.series||[]).includes(seri.value)) seri.value='';
  }catch(e){
    console.warn('Stock filter options:',e?.message||e);
  }finally{ST_FILTER_LOADING=false;}
}
function debounceStockFilters(){
  clearTimeout(ST_FILTER_TIMER);
  ST_FILTER_TIMER=setTimeout(loadStockFilterOptions,300);
}
(function bindStockFilterUX(){
  const motif=document.getElementById('fMotif'), seri=document.getElementById('fSeri');
  const wh=document.getElementById('fGudang'), bl=document.getElementById('fBlock'), kv=document.getElementById('fKav');
  [motif,seri,wh,bl,kv].forEach(el=>el?.addEventListener('focus',loadStockFilterOptions));
  motif?.addEventListener('input',debounceStockFilters);
  motif?.addEventListener('change',()=>{ if(seri)seri.value=''; loadStockFilterOptions(); });
  wh?.addEventListener('change',()=>{ if(bl)bl.value=''; if(kv)kv.value=''; loadStockFilterOptions(); });
  bl?.addEventListener('change',()=>{ if(kv)kv.value=''; loadStockFilterOptions(); });
})();
'''
          if js_marker not in s:
            raise SystemExit('Stock JS marker not found')
          s=s.replace(js_marker,helper+'\n'+js_marker,1)

          old_reset="""document.getElementById('stClear').addEventListener('click',()=>{
  ['fMotif','fSeri','fGudang','fBlock','fKav'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('fStatus').value=''; ST_PAGE=0; loadStock();
});"""
          new_reset="""document.getElementById('stClear').addEventListener('click',()=>{
  ['fMotif','fSeri','fGudang','fBlock','fKav'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('fStatus').value=''; ST_PAGE=0; loadStockFilterOptions(); loadStock();
});"""
          if old_reset not in s:
            raise SystemExit('Stock reset handler not found')
          s=s.replace(old_reset,new_reset,1)

          old_load="""async function loadStock(){
  const out=document.getElementById('stOut');
  if(!out) return;
  out.innerHTML='<div class=\"card muted\">⏳ Memuat…</div>';
  try{
    const d=await rpc('wms_stock_search', stFilters());"""
          new_load="""async function loadStock(){
  const out=document.getElementById('stOut');
  if(!out) return;
  out.innerHTML='<div class=\"card muted\">⏳ Memuat…</div>';
  try{
    loadStockFilterOptions();
    const d=await rpc('wms_stock_search', stFilters());"""
          if old_load not in s:
            raise SystemExit('loadStock header not found')
          s=s.replace(old_load,new_load,1)

          old_summary="""    document.getElementById('stSummary').innerHTML=
      `Menampilkan <b>${fmt(Math.min(ST_PAGE*ST_LIMIT+1,ST_TOTAL))}–${fmt(Math.min((ST_PAGE+1)*ST_LIMIT,ST_TOTAL))}</b> dari <b>${fmt(ST_TOTAL)}</b> baris · total <b>${fmt(d.total_qty)}</b> box`;"""
          new_summary="""    const af=[
      document.getElementById('fMotif').value.trim(),
      document.getElementById('fSeri').value.trim(),
      document.getElementById('fGudang').value.trim(),
      document.getElementById('fBlock').value.trim(),
      document.getElementById('fKav').value.trim(),
      document.getElementById('fStatus').value
    ].filter(Boolean);
    document.getElementById('stSummary').innerHTML=
      `Menampilkan <b>${fmt(Math.min(ST_PAGE*ST_LIMIT+1,ST_TOTAL))}–${fmt(Math.min((ST_PAGE+1)*ST_LIMIT,ST_TOTAL))}</b> dari <b>${fmt(ST_TOTAL)}</b> baris · total <b>${fmt(d.total_qty)}</b> box${af.length?` · Filter: <b>${af.map(esc).join(' · ')}</b>`:''}`;"""
          if old_summary not in s:
            raise SystemExit('Stock summary block not found')
          s=s.replace(old_summary,new_summary,1)

          p.write_text(s,encoding='utf-8')
          print('Stock searchable dropdown UX applied.')
          PY
      - name: Commit WMS update
        shell: bash
        run: |
          git config user.name 'Fang WMS'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve Stock On Hand filters with searchable dropdowns'
          git push
