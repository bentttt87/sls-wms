name: Apply Stock Search Combobox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stock-search-combobox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stock On Hand searchable dropdowns
        run: python .github/patch_stock_search.py
      - name: Commit WMS update
        run: |
          git config user.name 'Fang WMS'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve Stock On Hand filters with searchable dropdowns'
          git push
